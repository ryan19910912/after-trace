<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>AFTERTRACE 快速紀錄</title>
    <style>
      :root {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color-scheme: dark;
        --bg: #06111f;
        --surface: #0b1d31;
        --surface-raised: #102943;
        --border: rgba(91, 153, 220, .34);
        --border-strong: rgba(91, 167, 255, .62);
        --text: #f4f8ff;
        --muted: #9db1c8;
        --accent: #4da3ff;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        width: 420px;
        max-width: 420px;
        max-height: 600px;
        overflow-y: auto;
        font-family: inherit;
        background:
          radial-gradient(circle at 85% -10%, rgba(43, 124, 225, .20), transparent 15rem),
          linear-gradient(180deg, #071523 0%, var(--bg) 100%);
        color: var(--text);
      }
      main { width: 100%; padding: 14px; display: grid; gap: 10px; }
      h1 { margin: 0 0 2px; color: #fff; font-size: 19px; line-height: 1.25; letter-spacing: -.02em; }
      .muted { margin: 0; color: var(--muted); font-size: 11px; line-height: 1.5; }
      textarea, select {
        width: 100%;
        min-width: 0;
        color: var(--text);
        background: rgba(5, 17, 30, .92);
        border: 1px solid var(--border);
        border-radius: 10px;
        outline: none;
        font-size: 13px;
      }
      textarea { min-height: 92px; max-height: 180px; resize: vertical; padding: 10px 11px; line-height: 1.5; }
      textarea::placeholder { color: #7188a2; }
      select { min-height: 38px; padding: 7px 10px; }
      select:focus, textarea:focus { border-color: var(--border-strong); box-shadow: 0 0 0 3px rgba(77, 163, 255, .10); }
      select:disabled { color: #778ca4; background: rgba(8, 20, 34, .72); }
      button {
        min-height: 38px;
        padding: 8px 12px;
        border: 1px solid rgba(100, 176, 255, .65);
        border-radius: 10px;
        color: #fff;
        background: linear-gradient(180deg, #318eea, #1765bc);
        font-size: 13px;
        font-weight: 760;
        line-height: 1.25;
        white-space: nowrap;
        cursor: pointer;
        box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 6px 14px rgba(20, 91, 166, .16);
      }
      button:hover:not(:disabled) { background: linear-gradient(180deg, #45a0fa, #2173cd); }
      button:disabled { cursor: not-allowed; opacity: .48; box-shadow: none; }
      #disconnect, #voice, #screenshot {
        background: rgba(15, 39, 65, .92);
        border-color: rgba(87, 136, 190, .46);
        color: #e5f0fc;
        box-shadow: none;
      }
      .row { display: flex; gap: 8px; align-items: center; min-width: 0; }
      .row > label, .row > span { color: #dce8f6; font-size: 13px; }
      .grow { flex: 1; min-width: 0; }
      .page {
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 9px 10px;
        display: grid;
        gap: 4px;
        background: rgba(10, 29, 49, .84);
        font-size: 12px;
      }
      .page a { color: #82bdff; word-break: break-all; font-size: 11px; }
      .preview { display: block; max-width: 100%; max-height: 180px; object-fit: contain; border-radius: 10px; border: 1px solid var(--border); }
      .hidden { display: none !important; }
      .status { min-height: 16px; font-size: 11px; }
      .auth {
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 10px 11px;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 10px;
        background: linear-gradient(180deg, rgba(16, 42, 70, .82), rgba(9, 26, 44, .86));
      }
      .auth strong { min-width: 0; color: #fff; font-size: 13px; line-height: 1.35; }
      .auth .row { justify-content: flex-end; }
      #connect, #disconnect { min-width: 112px; }
      .footer-link { color: #72b7ff; font-size: 11px; font-weight: 700; text-underline-offset: 3px; }
      #save { width: 100%; }
      #voice, #screenshot { flex: 1; }
      input[type="checkbox"] { width: 16px; height: 16px; flex: 0 0 16px; accent-color: var(--accent); }
    </style>
  </head>
  <body>
    <main>
      <h1>快速紀錄</h1>

      <section class="auth">
        <strong id="authState">尚未連接 AFTERTRACE</strong>
        <div class="row">
          <button id="connect" type="button">連接 AFTERTRACE</button>
          <button id="disconnect" class="hidden" type="button">解除連接</button>
        </div>
      </section>

      <div class="row">
        <label for="source">記錄到</label>
        <select id="source" class="grow" disabled>
          <option value="">請先連接 AFTERTRACE</option>
        </select>
      </div>

      <textarea id="content" placeholder="輸入一段短紀錄，或使用語音輸入…"></textarea>
      <div class="row">
        <button id="voice" type="button">🎙️ 語音</button>
        <button id="screenshot" type="button">📷 擷取可見畫面</button>
      </div>
      <label class="row">
        <input id="includePage" type="checkbox" />
        <span>附上目前頁面</span>
      </label>
      <div id="pageContext" class="page hidden">
        <strong id="pageTitle"></strong>
        <a id="pageUrl" target="_blank" rel="noreferrer"></a>
      </div>
      <img id="screenshotPreview" class="preview hidden" alt="截圖預覽" />
      <div id="status" class="status muted"></div>
      <button id="save" type="button" disabled>請先連接 AFTERTRACE</button>
      <a id="openWeb" class="footer-link" href="https://after-trace-web-prod.after-lab.workers.dev/" target="_blank" rel="noreferrer">開啟完整 AFTERTRACE Web</a>
      <div class="muted">文字、選取文字、頁面 title/URL 與瀏覽器語音轉文字都走 AFTERTRACE Record API。頁面資訊只有你明確勾選時才會附上。若有擷取截圖，按「儲存」時會使用可用 AI 額度整理後送到 AFTERTRACE backend。</div>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
