<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AFTERTRACE 快速紀錄</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; width: 360px; background: #fff; color: #111; }
      main { padding: 16px; display: grid; gap: 12px; }
      h1 { font-size: 18px; margin: 0; }
      .muted { color: #666; font-size: 12px; }
      textarea { width: 100%; min-height: 110px; resize: vertical; box-sizing: border-box; padding: 10px; }
      select, button { min-height: 38px; }
      button { cursor: pointer; }
      button:disabled { cursor: not-allowed; opacity: .55; }
      .row { display: flex; gap: 8px; align-items: center; }
      .grow { flex: 1; }
      .page { border: 1px solid #ddd; border-radius: 8px; padding: 10px; display: grid; gap: 4px; }
      .page a { word-break: break-all; font-size: 12px; }
      .preview { max-width: 100%; border-radius: 8px; border: 1px solid #ddd; }
      .hidden { display: none; }
      .status { font-size: 12px; min-height: 18px; }
      .auth { border: 1px solid #ddd; border-radius: 8px; padding: 10px; display: grid; gap: 8px; }
      .auth strong { font-size: 13px; }
      .footer-link { font-size: 12px; }
    </style>
  </head>
  <body>
    <main>
      <h1>快速紀錄</h1>

      <section class="auth">
        <strong id="authState">尚未連接 AFTERTRACE</strong>
        <div class="row">
          <button id="connect" type="button">連接 AFTERTRACE</button>
          <button id="disconnect" class="hidden" type="button">解除連接</button>
        </div>
      </section>

      <div class="row">
        <label for="source">記錄到</label>
        <select id="source" class="grow" disabled>
          <option value="">請先連接 AFTERTRACE</option>
        </select>
      </div>

      <textarea id="content" placeholder="輸入一段短紀錄，或使用語音輸入…"></textarea>
      <div class="row">
        <button id="voice" type="button">🎙️ 語音</button>
        <button id="screenshot" type="button">📷 截圖預覽</button>
      </div>
      <label class="row">
        <input id="includePage" type="checkbox" />
        <span>附上目前頁面</span>
      </label>
      <div id="pageContext" class="page hidden">
        <strong id="pageTitle"></strong>
        <a id="pageUrl" target="_blank" rel="noreferrer"></a>
      </div>
      <img id="screenshotPreview" class="preview hidden" alt="截圖預覽" />
      <div id="status" class="status muted"></div>
      <button id="save" type="button" disabled>請先連接 AFTERTRACE</button>
      <a id="openWeb" class="footer-link" href="https://after-trace-web-prod.a0955625660.workers.dev/" target="_blank" rel="noreferrer">開啟完整 AFTERTRACE Web</a>
      <div class="muted">文字、選取文字、頁面 title/URL 與瀏覽器語音轉文字都會走 AFTERTRACE Record API。頁面資訊只有你明確勾選時才會附上，不會擷取完整頁面內容。截圖 AI 仍需 AI Pro／試用 entitlement。</div>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
