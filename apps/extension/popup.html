<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>AFTERTRACE 快速紀錄</title>
    <style>
      :root {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color-scheme: dark;
        --bg: #06111f;
        --surface: #0b1d31;
        --surface-raised: #102943;
        --border: rgba(91, 153, 220, .34);
        --border-strong: rgba(91, 167, 255, .62);
        --text: #f4f8ff;
        --muted: #9db1c8;
        --accent: #4da3ff;
        --success: #75e4ae;
      }
      * { box-sizing: border-box; }
      body {
        font-family: inherit;
        margin: 0;
        width: 380px;
        max-width: 100vw;
        background:
          radial-gradient(circle at 85% -10%, rgba(43, 124, 225, .20), transparent 15rem),
          linear-gradient(180deg, #071523 0%, var(--bg) 100%);
        color: var(--text);
      }
      main { padding: 18px; display: grid; gap: 14px; }
      h1 { font-size: 21px; margin: 0 0 2px; color: #fff; letter-spacing: -.02em; }
      .muted { color: var(--muted); font-size: 12px; line-height: 1.65; }
      textarea, select {
        width: 100%;
        color: var(--text);
        background: rgba(5, 17, 30, .92);
        border: 1px solid var(--border);
        border-radius: 12px;
        outline: none;
      }
      textarea { min-height: 125px; resize: vertical; padding: 12px; line-height: 1.55; }
      textarea::placeholder { color: #7188a2; }
      select { min-height: 42px; padding: 8px 11px; }
      select:focus, textarea:focus { border-color: var(--border-strong); box-shadow: 0 0 0 3px rgba(77, 163, 255, .10); }
      select:disabled { color: #778ca4; background: rgba(8, 20, 34, .72); }
      button {
        min-height: 42px;
        padding: 9px 14px;
        border: 1px solid rgba(100, 176, 255, .65);
        border-radius: 11px;
        color: #fff;
        background: linear-gradient(180deg, #318eea, #1765bc);
        font-weight: 760;
        cursor: pointer;
        box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 8px 18px rgba(20, 91, 166, .18);
      }
      button:hover:not(:disabled) { background: linear-gradient(180deg, #45a0fa, #2173cd); }
      button:disabled { cursor: not-allowed; opacity: .48; box-shadow: none; }
      #disconnect, #voice, #screenshot {
        background: rgba(15, 39, 65, .92);
        border-color: rgba(87, 136, 190, .46);
        color: #e5f0fc;
        box-shadow: none;
      }
      .row { display: flex; gap: 9px; align-items: center; }
      .row > label, .row > span { color: #dce8f6; }
      .grow { flex: 1; min-width: 0; }
      .page {
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 11px;
        display: grid;
        gap: 5px;
        background: rgba(10, 29, 49, .84);
      }
      .page a { color: #82bdff; word-break: break-all; font-size: 12px; }
      .preview { max-width: 100%; border-radius: 11px; border: 1px solid var(--border); }
      .hidden { display: none; }
      .status { font-size: 12px; min-height: 18px; }
      .auth {
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 13px;
        display: grid;
        gap: 10px;
        background: linear-gradient(180deg, rgba(16, 42, 70, .82), rgba(9, 26, 44, .86));
      }
      .auth strong { font-size: 14px; color: #fff; }
      .footer-link { color: #72b7ff; font-size: 12px; font-weight: 700; text-underline-offset: 3px; }
      #save { width: 100%; }
      input[type="checkbox"] { width: 17px; height: 17px; accent-color: var(--accent); }
    </style>
  </head>
  <body>
    <main>
      <h1>快速紀錄</h1>

      <section class="auth">
        <strong id="authState">尚未連接 AFTERTRACE</strong>
        <div class="row">
          <button id="connect" type="button">連接 AFTERTRACE</button>
          <button id="disconnect" class="hidden" type="button">解除連接</button>
        </div>
      </section>

      <div class="row">
        <label for="source">記錄到</label>
        <select id="source" class="grow" disabled>
          <option value="">請先連接 AFTERTRACE</option>
        </select>
      </div>

      <textarea id="content" placeholder="輸入一段短紀錄，或使用語音輸入…"></textarea>
      <div class="row">
        <button id="voice" type="button">🎙️ 語音</button>
        <button id="screenshot" type="button">📷 擷取可見畫面</button>
      </div>
      <label class="row">
        <input id="includePage" type="checkbox" />
        <span>附上目前頁面</span>
      </label>
      <div id="pageContext" class="page hidden">
        <strong id="pageTitle"></strong>
        <a id="pageUrl" target="_blank" rel="noreferrer"></a>
      </div>
      <img id="screenshotPreview" class="preview hidden" alt="截圖預覽" />
      <button id="saveScreenshot" class="hidden" type="button">用 AI 整理截圖並儲存</button>
      <div id="status" class="status muted"></div>
      <button id="save" type="button" disabled>請先連接 AFTERTRACE</button>
      <a id="openWeb" class="footer-link" href="https://after-trace-web-prod.after-lab.workers.dev/" target="_blank" rel="noreferrer">開啟完整 AFTERTRACE Web</a>
      <div class="muted">文字、選取文字、頁面 title/URL 與瀏覽器語音轉文字都走 AFTERTRACE Record API。頁面資訊只有你明確勾選時才會附上。截圖只在你按「用 AI 整理截圖並儲存」後送到 AFTERTRACE backend，需有可用 AI 額度。</div>
    </main>
    <script src="popup.js"></script>
    <script src="screenshot-ai.js"></script>
  </body>
</html>
