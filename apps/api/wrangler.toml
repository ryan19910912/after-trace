name = "after-trace-api"
main = "src/worker.ts"
compatibility_date = "2026-08-29"
compatibility_flags = ["nodejs_compat"]

[vars]
# New browser management app. WEB_AUTH_SECRET and LINE_LOGIN_CHANNEL_SECRET stay
# in Cloudflare Worker secrets and must never be committed here.
WEB_APP_URL = "https://after-trace.pages.dev"
WEB_APP_ORIGIN = "https://after-trace.pages.dev"
LINE_LOGIN_CHANNEL_ID = ""

# Legacy LIFF vars stay during the cutover only. Remove after Web Auth production
# verification succeeds.
LIFF_CHANNEL_ID = "2011322889"
LIFF_APP_URL = "https://liff.line.me/2011322889-AU0teTPM"
LIFF_WEB_ORIGIN = "https://after-trace.pages.dev"

[observability]
enabled = true
